services:
  - type: web
    name: ecommerce-agent-ai
    runtime: docker
    plan: free
    region: frankfurt
    domains:
      - ecommerce-agent.michalsalek.com
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: minilm
      - key: CHAT_MAX_CONCURRENT
        value: "2"
      - key: CHAT_REQUESTS_PER_HOUR
        value: "120"
